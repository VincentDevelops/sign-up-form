<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>
        Sign Up Form
    </title>
    <link rel="stylesheet" href="/styles/style.css">
</head>
<body>

    <div class="container flex">

        <header class="logo flex">
            
            <img class="logo-img" src="/assets/images/odin-lined.png" alt="Logo">
            <h1 class="logo-text">ODIN</h1>

        </header>

        <main class="container-main flex">
 
            <img class="image flex " src="../assets/images/halie-west-25xggax4bSA-unsplash.jpg" alt="image of plants">

            <section class="sign-up">

                <form class="sign-up-form flex" action="post">

                    <h3 class="sign-up-title">Let's do this!</h3>

                    <label class="prompt" for="first_name">FIRST NAME*</label>
                    <input type="text" id="first_name" class="input">

                    <label class ="prompt" for="last_name">LAST NAME</label>
                    <input type="text" id="last_name" class="input">

                    <label for="phone_number" class="prompt">PHONE NUMBER</label>
                    <input type="tel" id="phone_number" class="input">
                    
                    <label for="user_email" class="prompt">EMAIL*</label>
                    <input type="email" id="user_email" class="input">


                    <label for="user_password" class="prompt">PASSWORD*</label>
                    <input type="password" id="user_password" class="input">

                    <label for="confirm_user_password" class="prompt">CONFIRM PASSWORD*</label>
                    <input type="password" id="confirm_user_password" class="input">
                    
                    <button class="sign-up-button button">Create Account</button>
                </form>
                <span class="log-in flex">Already have an account?&nbsp<a href=".">Log in</a></span>
            </section>

        </main>
        
        <footer class="footer flex">

            <div class="links flex">

                <a href=""https://vincentdevelops.com/" class="link">VincentDevelops.com</a>
                <img id="git-link" src="/assets/images/github.png" alt="GitHub Logo">

            </div>

        </footer>

    </div>


</body>
</html>
